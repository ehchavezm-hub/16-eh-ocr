name: eh-ocr

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tesseract y librerías de Qt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-spa tesseract-ocr-deu libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --no-deps -r requirements-tablas.txt
      - name: Licencias (sin GPL/AGPL)
        run: python scripts/verificar_licencias.py
      - name: Modelos (para probar también tablas sin bordes)
        run: python scripts/preparar_build.py --solo-modelos
      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

  paquete-windows:
    # Construye eh-ocr.zip al publicar una versión (tag v*), a pedido, o en ramas de
    # desarrollo claude/**; no en cada cambio de main, para ahorrar minutos de Windows.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/claude/')
    needs: pruebas
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tesseract (binarios para incluir en el paquete)
        run: choco install tesseract -y --no-progress
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install --no-deps -r requirements-tablas.txt
      - name: Licencias (sin GPL/AGPL)
        run: python scripts/verificar_licencias.py
      - name: Recursos del paquete (modelos medium + Tesseract + idiomas)
        run: python scripts/preparar_build.py --tesseract "C:\Program Files\Tesseract-OCR"
      - name: Pruebas con los recursos finales
        env:
          QT_QPA_PLATFORM: offscreen
          EH_OCR_TESSERACT_INCLUIDO: "1"
        run: pytest -v
      - name: Construir eh-ocr.exe
        run: pyinstaller eh-ocr.spec --noconfirm
      - name: Autoprueba del ejecutable (sin internet)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\eh-ocr\eh-ocr.exe" -ArgumentList "--autoprueba","$PWD\autoprueba.txt" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "La autoprueba no terminó en 5 minutos" }
          if (Test-Path autoprueba.txt) { Get-Content autoprueba.txt } else { throw "La autoprueba no escribió resultados" }
          if ($p.ExitCode -ne 0) { throw "La autoprueba del ejecutable falló" }
          if (-not (Select-String -Path autoprueba.txt -Pattern "'modelos': 'medium'" -Quiet)) { throw "El paquete no usa los modelos medium" }
          if (-not (Select-String -Path autoprueba.txt -Pattern "'tablas_estructura': True" -Quiet)) { throw "El paquete no incluye el modelo de tablas" }
          if (-not (Select-String -Path autoprueba.txt -Pattern "'tablas_layout': True" -Quiet)) { throw "El paquete no incluye el detector de tablas" }
      - name: Comprimir
        shell: pwsh
        run: |
          Copy-Item LICENCIAS.md dist\eh-ocr\
          Compress-Archive -Path dist\eh-ocr -DestinationPath eh-ocr.zip -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item eh-ocr.zip).Length / 1MB, 1)
          $dir = [math]::Round((Get-ChildItem dist\eh-ocr -Recurse | Measure-Object Length -Sum).Sum / 1MB, 1)
          "ZIP: $mb MB · descomprimido: $dir MB" | Tee-Object -FilePath tamano.txt
      - uses: actions/upload-artifact@v4
        with:
          name: eh-ocr-windows
          path: |
            eh-ocr.zip
            tamano.txt
            autoprueba.txt
          retention-days: 30
      - name: Publicar versión
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" eh-ocr.zip --title "eh-ocr ${{ github.ref_name }}" --notes-file tamano.txt
